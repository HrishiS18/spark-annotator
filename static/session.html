<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task session</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side-brand" id="brand"></div>
    <div class="side-label">Your session</div>
    <nav class="steps" id="steps"></nav>
    <div class="task-card" id="task"></div>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <span id="top-ic"></span><span class="topbar-title" id="top-title"></span>
      <div class="topbar-right"><span id="top-runtime"></span><span id="top-actions"></span></div>
    </div>
    <div id="banner"></div>
    <div class="content" id="content"></div>
    <div class="composer-wrap hidden" id="composer-wrap">
      <form class="composer" id="composer">
        <button class="composer-add hidden" type="button" id="add-file" title="Add task file" aria-label="Add task file">+</button>
        <textarea id="input" rows="1" placeholder="Ask a follow-up…" aria-label="Message"></textarea>
        <button class="btn btn-primary btn-sm" type="submit" id="send">Send</button>
      </form>
      <div class="composer-context hidden" id="composer-context" aria-label="Claude Code session settings"></div>
      <div class="hint"><span><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span><span><kbd>Ctrl</kbd>+<kbd>M</kbd> mark moment</span></div>
    </div>
  </main>
</div>
<section class="voice-dock hidden" id="voice-dock" aria-label="Codex voice chat">
  <div class="voice-top"><span class="voice-title">Voice chat</span><span class="voice-status" id="voice-status" role="status">Ready</span></div>
  <div class="voice-presence"><span class="voice-orb" aria-hidden="true"></span><span id="voice-caption">Talk through your task with Codex.</span></div>
  <div class="voice-controls">
    <button class="btn btn-primary" type="button" id="voice-start">Start voice chat</button>
    <button class="btn btn-sm hidden" type="button" id="voice-enable-sound">Enable sound</button>
    <button class="btn btn-sm hidden" type="button" id="voice-mute" aria-pressed="false">Mute mic</button>
    <button class="btn btn-sm hidden" type="button" id="voice-end">End voice chat</button>
    <button class="btn btn-sm btn-ghost" type="button" id="voice-mark">Mark moment</button>
  </div>
  <audio id="voice-audio" autoplay playsinline></audio>
</section>
<button class="mark-fab hidden" id="fab" aria-label="Mark this moment"><span id="fab-ic"></span><span>Mark moment</span><span class="count" id="fab-count">0</span></button>
<script type="module" src="/static/session.js"></script>
</body>
</html>
