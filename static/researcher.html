<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark Research Dashboard</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="rs">
  <aside class="rs-list">
    <div class="side-brand" id="brand"></div>
    <div class="row" style="padding:6px 8px 10px">
      <a class="btn btn-sm" href="/api/export/marks.csv">marks.csv</a>
      <a class="btn btn-sm" href="/api/export/highlights.csv">highlights.csv</a>
      <a class="btn btn-sm" href="/api/export/candidates.csv">candidates.csv</a>
    </div>
    <div style="padding:0 8px 10px"><a href="/validation">Validate the judge →</a></div>
    <input type="text" id="filter" placeholder="Filter by participant, study…" style="margin:0 0 10px">
    <div id="list"></div>
    <div class="side-foot" style="margin-top:14px"><a href="/">← New session</a></div>
  </aside>
  <main class="rs-main" id="main"><div class="narrow muted">Select a session.</div></main>
</div>
<script type="module" src="/static/researcher.js"></script>
</body>
</html>
